name: Build and push Docker image

on:
  push:
    branches:
      - s100177/stable
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (default: the branch name)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags
        id: tags
        shell: bash
        run: |
          RAW_TAG="${{ inputs.tag || github.ref_name }}"
          IMAGE_TAG="${RAW_TAG//\//-}"
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"
          # If pushing to default branch, also tag as latest
          if [ "${{ github.ref_name }}" = "s100177/stable" ]; then
            TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            USE_CN_MIRROR=false
